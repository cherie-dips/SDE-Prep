<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDE Job Prep</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PVT13BPF32"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-PVT13BPF32');
</script>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/notes.css">
<link rel="stylesheet" href="css/appdesign-topic.css">
</head>
<body>
<header>
  <a class="brand" href="https://cherie-dips.github.io/SDE-Prep/">SDE Prep</a>
  <nav id="mainNav">
    <a class="on" data-v="cal">Calendar</a>
    <a data-v="road">Roadmap</a>
    <a data-v="notes">Notes</a>
  </nav>
  <div class="hdr-right">
    <div class="ai-note" id="aiNote" title="The roadmap's explanations, MCQs and practice sets were generated with AI. Verify anything you rely on. (The Notes PDFs are not AI-generated.)">
      <span class="ai-dot" aria-hidden="true"></span>AI-generated content
    </div>
    <div class="hstats">
      <span>Progress <strong id="hProg">0%</strong></span>
      <span>Topics <strong id="hTop">0/0</strong></span>
    </div>
  </div>
</header>

<div class="view" id="v-road">
  <div class="road-side" id="roadSide"></div>
  <div class="road-main">
    <div class="road-head" id="roadHead"><h2>SDE Prep Roadmap</h2><div class="rh-sub">Select a category to begin</div></div>
    <div class="road-tabs" id="roadTabs"></div>
    <div class="road-topics" id="roadTopics"><div class="empty-msg">Loading content...</div></div>
  </div>
</div>

<div class="view on" id="v-cal">
  <div class="cal-left">
    <div class="plan-bar" id="planBar"></div>
    <div class="cal-head"><h2 id="calTitle"></h2><div class="cal-nav"><button onclick="calNav(-1)">&larr;</button><button onclick="calToday()">Today</button><button onclick="calNav(1)">&rarr;</button></div></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="dash-inline"><h4>Roadmap Progress</h4><div class="prog-grid" id="roadProg"></div></div>
  </div>
  <div class="day-panel" id="dayPanel"><div class="empty-msg">Select a day</div></div>
</div>

<div class="view" id="v-notes"></div>

<div class="toast" id="toast"></div>

<script src="js/content-cpp-dsa.js"></script>
<script src="js/content-cs.js"></script>
<script src="js/content-dev.js"></script>
<script src="js/content-sysdes.js"></script>
<script src="js/content-appdesign.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/notes-data.js"></script>
<script src="js/notes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
